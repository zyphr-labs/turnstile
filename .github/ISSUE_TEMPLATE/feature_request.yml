name: Feature proposal
description: Describe a user problem and a proposed change.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe who needs this and where current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give a concrete example of the action and decision you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include existing workarounds and any effect on legitimate agent work, privacy, or integration complexity.
